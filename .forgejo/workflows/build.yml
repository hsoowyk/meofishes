name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Builds the x86_64 (amd64) Linux binary.
# The git.5418.org runner is arm64, so this cross-compiles: Debian multiarch
# provides the amd64 Qt packages and the x86_64-linux-gnu-g++ compiler.

jobs:
  linux-amd64:
    runs-on: docker
    container:
      image: golang:1.26-bookworm
    env:
      CGO_CXXFLAGS: "-O1 -w"
      GOFLAGS: "-buildvcs=false"
    steps:
      - name: Install cross toolchain and amd64 Qt
        run: |
          dpkg --add-architecture amd64
          apt-get update
          apt-get install -y --no-install-recommends nodejs git pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu libc6-dev-amd64-cross \
            qtbase5-dev:amd64

      - uses: actions/checkout@v4

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            /root/.cache/go-build
            /go/pkg/mod
          key: go-amd64-${{ hashFiles('go.sum') }}
          restore-keys: go-amd64-

      # pure-Go packages, run on the runner's own CPU (no Qt involved)
      - name: Test
        run: CGO_ENABLED=0 go test ./internal/core/... ./internal/lyrics/... ./internal/theme/... ./internal/plugin/...

      - name: Build (x86_64)
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
          CC: x86_64-linux-gnu-gcc
          CXX: x86_64-linux-gnu-g++
          PKG_CONFIG_LIBDIR: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: |
          pkg-config --modversion Qt5Widgets
          go build -gcflags='meofishes/...=-e' -o meofishes ./cmd/meofishes
          file meofishes || true

      - uses: actions/upload-artifact@v3
        with:
          name: meofishes-linux-x86_64
          path: meofishes
